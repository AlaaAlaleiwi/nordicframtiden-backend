sentry:
  dsn: ${SENTRY_DSN:}
  enabled: ${SENTRY_ENABLED:true}
  logs:
    enabled: true
  logging:
    enabled: false
    minimum-level: info
    minimum-event-level: warn
    minimum-breadcrumb-level: info
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:development}}
  release: ${SENTRY_RELEASE:}
  # Avoid attaching user identity, request bodies, or query parameters to events.
  data-collection:
    user-info: false
    http-bodies: []
    url-query-params:
      mode: off

app:
  document-key: ${APP_DOCUMENT_KEY:}
  jwt:
    secret: ${APP_JWT_SECRET}
    accessTokenMinutes: ${APP_JWT_EXPIRES_MIN:15}
    refreshTokenDays: ${APP_JWT_REFRESH_DAYS:30}
    issuer: ${APP_JWT_ISSUER:nordicframtiden}
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:}
    to: ${MAIL_TO:}
  firebase:
    enabled: ${APP_FIREBASE_ENABLED:false}
    project-id: ${APP_FIREBASE_PROJECT_ID:}
    web-api-key: ${APP_FIREBASE_WEB_API_KEY:}
    auth-domain: ${APP_FIREBASE_AUTH_DOMAIN:}
    storage-bucket: ${APP_FIREBASE_STORAGE_BUCKET:}
    messaging-sender-id: ${APP_FIREBASE_MESSAGING_SENDER_ID:}
    app-id: ${APP_FIREBASE_APP_ID:}
    vapid-public-key: ${APP_FIREBASE_VAPID_PUBLIC_KEY:}
  apns:
    enabled: ${APP_APNS_ENABLED:false}
    team-id: ${APP_APNS_TEAM_ID:}
    key-id: ${APP_APNS_KEY_ID:}
    private-key: ${APP_APNS_PRIVATE_KEY:}
    bundle-id: ${APP_APNS_BUNDLE_ID:}
  skatteverket:
    tax-table-import:
      enabled: ${SKATTEVERKET_TAX_TABLE_IMPORT_ENABLED:true}
      index-url: ${SKATTEVERKET_TAX_TABLE_INDEX_URL:https://www.skatteverket.se/specialversionerforprogramforetagmfl.4.319dc1451507f2f99e86ee.html}
      one-time-url: ${SKATTEVERKET_ONE_TIME_TAX_URL:https://www.skatteverket.se/privat/skatter/arbeteochinkomst/askattsedelochskattetabeller/engangsbelopp.4.70ac421612e2a997f85800014872.html}
      cron: ${SKATTEVERKET_TAX_TABLE_IMPORT_CRON:0 15 3 * * *}
      timeout-seconds: ${SKATTEVERKET_TAX_TABLE_IMPORT_TIMEOUT_SECONDS:30}
    tax:
      enabled: ${SKATTEVERKET_TAX_ENABLED:false}
      base-url: ${SKATTEVERKET_TAX_BASE_URL:https://api.skatteverket.se/inkomstbeskattning/fraga-om-skatteavdrag-i-kronor/v1}
      client-id: ${SKATTEVERKET_TAX_CLIENT_ID:}
      client-secret: ${SKATTEVERKET_TAX_CLIENT_SECRET:}
      timeout-seconds: ${SKATTEVERKET_TAX_TIMEOUT_SECONDS:10}

server:
  # Cloud Run injects PORT. Keep 8080 as the local/default container port.
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    # The framework warning includes its generated development password verbatim.
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
  redis:
    time-to-live: 86400000  # 24h in ms — tune to your needs
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
